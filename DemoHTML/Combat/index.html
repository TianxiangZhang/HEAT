<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEAT Combat Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-ui">
        <h2 style="font-size: 18px;">HEAT 战斗原型 V1.0</h2>
        <p style="color: #888; font-size: 12px; margin-bottom: 10px;">Phase 6: 信号博弈与动态多普勒</p>
        
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <div style="flex: 1; background: #1a0f14; padding: 10px; border-radius: 8px; border: 1px solid #551133;">
                <h3 style="color: #ff3366; font-size: 13px; margin-bottom: 5px;">敌舰 (Target)</h3>
                <progress id="enemy-shield-bar" value="200" max="200" style="width: 100%; height: 8px; accent-color: #00aaff;"></progress>
                <progress id="enemy-hp-bar" value="800" max="800" style="width: 100%; height: 8px; accent-color: #00ffcc; margin-top: 5px;"></progress>
            </div>
            <div style="flex: 1; background: #0f1a14; padding: 10px; border-radius: 8px; border: 1px solid #115533;">
                <h3 style="color: #33ff66; font-size: 13px; margin-bottom: 5px;">本舰 (Player)</h3>
                <progress id="player-shield-bar" value="200" max="200" style="width: 100%; height: 8px; accent-color: #00aaff;"></progress>
                <progress id="player-hp-bar" value="800" max="800" style="width: 100%; height: 8px; accent-color: #00ffcc; margin-top: 5px;"></progress>
            </div>
        </div>

        <div style="background: #101520; padding: 12px; border-radius: 8px; border: 1px solid #224466; margin-bottom: 10px;">
            <h3 style="color: #66ccff; margin-bottom: 10px; font-size: 14px;">空间传感器 (雷达火控)</h3>
            
            <div style="margin-bottom: 8px;">
                <label style="display: block; margin-bottom: 2px; font-size: 12px; color: #aaa;">
                    相对距离 (Distance): <span id="dist-val" style="color:#fff;">1000</span> m
                </label>
                <input type="range" id="dist-slider" min="500" max="8000" step="100" value="1000" style="width: 100%; accent-color: #66ccff;" oninput="document.getElementById('dist-val').innerText = this.value">
            </div>
            
            <div style="margin-bottom: 12px;">
                <label style="display: block; margin-bottom: 2px; font-size: 12px; color: #aaa;">
                    敌方绝对航速 (Velocity): <span id="speed-val" style="color:#fff;">50</span> m/s (阈值: 100)
                </label>
                <input type="range" id="speed-slider" min="0" max="1000" step="10" value="50" style="width: 100%; accent-color: #ffaa00;" oninput="document.getElementById('speed-val').innerText = this.value">
            </div>

            <div>
                <label style="display: block; margin-bottom: 2px; font-size: 12px; color: #aaa;">
                    锁定解析度 (Resolution): <span id="res-val" style="color:#00ffcc; font-weight:bold;">100</span>%
                </label>
                <progress id="res-bar" value="100" max="100" style="width: 100%; height: 10px; accent-color: #00ffcc;"></progress>
            </div>
        </div>

        <div style="background: #1a1a20; padding: 12px; border-radius: 8px; border: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="color: #00ffcc; font-size: 14px;">武器控制: 动能机炮</h3>
                <span style="font-size: 12px; color: #ffcc00;">热量: <span id="player-heat-val">0</span>/150</span>
            </div>
            
            <div style="margin-bottom: 8px;">
                <label style="display: block; margin-bottom: 2px; font-size: 12px; color: #aaa;">
                    输入功率 (Pin): <span id="power-val" style="color:#fff; font-weight:bold;">10</span> MW
                </label>
                <input type="range" id="power-slider" min="0" max="40" step="1" value="10" style="width: 100%;" oninput="document.getElementById('power-val').innerText = this.value">
            </div>
            
            <div style="display: flex; gap: 5px;">
                <progress id="charge-bar" value="0" max="30" style="flex: 2; height: 8px; accent-color: #ffaa00; margin-top: 4px;"></progress>
                <progress id="player-heat-bar" value="0" max="150" style="flex: 1; height: 8px; accent-color: #ffcc00; margin-top: 4px;"></progress>
            </div>
        </div>
    </div>

    <div id="console-container">
        <div id="console-header">=== 战术终端输出 (Log) ===</div>
        <div id="console-output"></div>
    </div>

    <script src="config.js"></script>
    <script src="game.js"></script>
</body>
</html>
